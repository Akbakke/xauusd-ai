require_v9_for_entry: false
entry_models:
  v9:
    enabled: false
  v10:
    enabled: false
  v10_ctx:
    enabled: true
    bundle_dir: /home/andre2/GX1_DATA/models/models/entry_v10_ctx/ENTRY_V10_CTX__RETRAIN_20260402_REPLACE_ON_SHORT_STRICT_CLEAN_RECIPE_2025
entry_policy_v10_ctx:
  enabled: true
  min_prob_long: 0.05
  min_prob_short: 0.05
  tradable_gate_enabled: true
  # Canonical lane keeps one general tradable threshold plus a slightly stricter short floor.
  tradable_min_prob: 0.10
  tradable_min_prob_short: 0.12
  quality_gate_enabled: true
  quality_min_mfe_first_n: 0.26
  # Canonical lane keeps one general path-quality threshold plus a slightly stricter short floor.
  quality_min_path_quality: 0.13
  quality_min_path_quality_short: 0.14
  # Canonical admission priority: under full capacity, a new OVERLAP long may
  # replace the oldest active OVERLAP short. This is the one explicit
  # capacity preference in the active lane.
  replace_oldest_overlap_short_with_overlap_long_when_full: true
  allow_short: true
  allow_high_vol: true
  allow_extreme_vol: false
  require_trend_up: false
  enable_profitable_filter: false
meta_model:
  enabled: true
  model_path: gx1/models/farm_entry_meta/baseline_model.pkl
  feature_cols_path: gx1/models/farm_entry_meta/feature_cols.json
allowed_sessions:
- EU
- OVERLAP
- US
allowed_vol_regimes:
- LOW
- MEDIUM
- HIGH
allowed_trend_regimes: []
guard:
  enabled: true
